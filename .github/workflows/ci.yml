name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restaurar dependencias API
      run: dotnet restore AdopcionAPI/
      
    - name: Restaurar dependencias Web
      run: dotnet restore AdopcionWeb/
      
    - name: Compilar API (Build)
      run: dotnet build AdopcionAPI/ --no-restore
      
    - name: Compilar Web (Build)
      run: dotnet build AdopcionWeb/ --no-restore
